# Publishing a release: Actions > Release > Run workflow. It publishes the version in cratedigger/__init__.py as a
# GitHub Release (tag vX.Y.Z); the app's Update check looks for the newest published release.
name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('cratedigger/__init__.py').read()).group(1))")"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V already published"; exit 0; fi
          gh release create "$V" --target "$GITHUB_SHA" --title "CrateDigger $V" --generate-notes
